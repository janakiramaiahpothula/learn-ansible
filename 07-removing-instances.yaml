- name: Delete multiple AWS EC2 instances
  hosts: local
  connection: local
  gather_facts: false

  tasks:
    - name: Terminate multiple EC2 instances
      amazon.aws.ec2_instance_info:
        region: us-east-1
        filters:
            "tag:NAME":
                - Roboshop-Ansible1
                - Roboshop-Ansible2
                - Roboshop-Ansible3

      state: absent
      wait: true