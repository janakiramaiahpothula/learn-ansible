- name: Create AWS instance with ansible
  hosts: local
  connection: local
  gather_facts: false

  tasks:
     - name: Launch EC2 instance
       amazon.aws.ec2_instance:
        name: Robosho-Ansible
        region: us-east-1
        instance_type: t3.micro
        count: 3
        image_id: ami-0055977a6e828a4f4
        security_group: sg-0f87a6e45d9cdd34d
        state: present


      
