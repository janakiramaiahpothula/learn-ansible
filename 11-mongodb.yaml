- name: Install and configure MongoDB for RoboShop
  hosts: mongo
  become: true
  gather_facts: false

  tasks:
    - name: Configure MongoDB 7 repository
      ansible.builtin.yum_repository:
        name: mongodb-org-7.0
        description: MongoDB Community Edition 7.0
        baseurl: https://repo.mongodb.org/yum/redhat/9/mongodb-org/7.0/x86_64/
        gpgcheck: true
        enabled: true
        gpgkey: https://pgp.mongodb.com/server-7.0.asc

    - name: Install MongoDB packages
      ansible.builtin.dnf:
        name: mongodb-org
        state: present
        update_cache: true

    - name: Configure MongoDB network binding
      ansible.builtin.lineinfile:
        path: /etc/mongod.conf
        regexp: '^\s*bindIp:'
        line: '  bindIp: 0.0.0.0'
        backup: true
      notify: Restart MongoDB

    - name: Enable and start MongoDB
      ansible.builtin.systemd:
        name: mongod
        enabled: true
        state: started

  handlers:
    - name: Restart MongoDB
      ansible.builtin.systemd:
        name: mongod
        state: restarted
