- name: Remove Nginx from Linux server
  hosts: local
  become: true
  gather_facts: true

  tasks:
    - name: Stop and disable Nginx
      ansible.builtin.service:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove Nginx package on RedHat systems
      ansible.builtin.dnf:
        name: nginx
        state: absent
      when: ansible_os_family == "RedHat"
